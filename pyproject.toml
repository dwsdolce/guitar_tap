[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar-tap"
version = "0.11"
requires-python = ">=3.14"
# The dependencies are requirements.txt — one list, read by pip installing this package and by
# `pip install -r`. The groups for testing and building installers are requirements-dev.txt and
# requirements-packaging.txt.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/guitar_tap/models"]
omit = ["tests/*", ".venv/*"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src/guitar_tap"
explicit_package_bases = true
namespace_packages = true
exclude = ["tests/", ".venv/", "build/", "dist/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
