# The Python edition's tests on Linux, Windows and macOS: the full pytest suite, then the export tests
# against Swift's expected values (Tooling/run-export-check.sh). Set up as the README's "Setting up on a
# new machine" says — this repo's .venv from requirements-dev.txt — in bash on every OS.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # UTC before Python starts, for the export tests' dates: Windows' C runtime reads TZ only then.
    env:
      TZ: UTC0
    defaults:
      run:
        shell: bash
    steps:
      # The whole history and its tags: the build number is the commit count, and the release guard
      # compares the version with the last release's tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # PortAudio for sounddevice, and the libraries Qt needs to draw off-screen. macOS and Windows get
      # them inside the wheels.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Python environment
        run: |
          python -m venv .venv
          bin=.venv/bin; [ -d .venv/Scripts ] && bin=.venv/Scripts
          "$bin/python" -m pip install --upgrade pip
          "$bin/python" -m pip install -r requirements-dev.txt
          "$bin/python" -m pip install -e . --no-deps

      - name: Tests
        run: |
          bin=.venv/bin; [ -d .venv/Scripts ] && bin=.venv/Scripts
          "$bin/python" -m pytest -q

      - name: Export check
        run: Tooling/run-export-check.sh

      - name: Exports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exports-${{ runner.os }}
          path: build/export-check
          if-no-files-found: ignore
