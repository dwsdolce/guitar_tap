# The release builds made on GitHub — the Linux AppImage, .deb and .rpm, the Windows installer, and the macOS .dmg
# with the release-notes and Quick Start PDFs — attached to a draft GitHub release with their SHA256SUMS, or kept as
# the run's artifacts. The user manual's PDF, built in the GuitarTap repository, is uploaded to the draft by hand.
#
# Run by hand (Actions → Release → Run workflow), for:
# - a release tag: builds the tag; with "draft" it creates the tag's draft release with both files (or adds them to
#   the tag's draft if there is one). The owner uploads the files built by hand, writes the release's notes on the
#   draft and publishes it; publishing builds nothing.
# - a test: builds a branch or commit; with "draft" it makes a draft named "release" for a tag that does not exist
#   (release-test-<n>), which GitHub creates only if the draft is published — delete the draft and nothing is left.
#
# The workflow runs from main, so it builds a tag made before it existed.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to build"
        required: true
      release:
        description: "Draft release to create or add to: blank for the tag's own; a test name (release-test-1) for a branch or commit"
        required: false
        default: ""
      draft:
        description: "Attach the files to the draft release (otherwise keep them as the run's artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  REF: ${{ inputs.ref }}

jobs:
  # The Linux AppImage, .deb and .rpm, built on the oldest supported Ubuntu LTS so they start on every supported
  # Linux. The built app uses the system's C library, so the machine it is built on sets the oldest Linux it runs on:
  # here Ubuntu 22.04 (glibc 2.35), with the Python that setup-python builds for it. The current appimagetool embeds
  # a static runtime, which needs no libfuse2 on the user's system. The .deb and .rpm carry the same built app
  # (packaging/make_linux_package).
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      APPIMAGETOOL_VERSION: "1.9.1"
    steps:
      # The whole history: the build number is the commit count, and the release guard compares the version with
      # the last release's tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The libraries Qt needs to start, as a Linux desktop has them; the two the build bundles
      # (packaging/build_linux checks both): libxcb-cursor0, which Qt needs to open a window under X11 and not
      # every desktop has, and PortAudio, which the start test then removes; and what makes the .deb (dpkg-dev)
      # and the .rpm (rpm).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libportaudio2 \
            dpkg-dev rpm

      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-packaging.txt
          .venv/bin/python -m pip install -e . --no-deps

      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"

      # appimagetool is itself an AppImage; extracted and run, it needs no FUSE on the runner.
      - name: Build
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/build_linux

      - name: Check the version and build
        run: |
          for format in AppImage deb rpm; do
            packaging/check_release_build "dist/guitar-tap-*.$format"
          done

      # The oldest Linux it starts on: the newest glibc symbol any bundled library needs, and a runtime that
      # does not link libfuse2.
      - name: Check what it needs from the system
        run: |
          image=$(ls dist/guitar-tap-*.AppImage)
          echo "Built $image"
          if ldd "$image" 2>&1 | grep -q "libfuse"; then
              echo "The runtime links libfuse:"; ldd "$image"; exit 1
          fi
          # objdump fails on bundled files that are not ELF (scripts, data marked executable); those are skipped.
          newest=$( { find dist/AppDir -type f \( -name '*.so*' -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null || true; } \
              | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Newest glibc needed: $newest"
          printf '%s\n%s\n' "$newest" "GLIBC_2.35" | sort -V -C || { echo "Needs more than glibc 2.35"; exit 1; }

      # The bundled audio libraries (PortAudio, and what the build pulled in with it); none of the libraries
      # that must be the system's (packaging/guitar-tap.spec); the icons and fonts where the app reads them.
      - name: Bundled libraries and files
        run: |
          internal=dist/guitar-tap/_internal
          ls -l "$internal" | grep -i -E "portaudio|asound|jack|pulse" || true
          bundled=$(ls "$internal" | grep -E "^lib(asound|glib-2|gobject-2|gio-2|gmodule-2|gthread-2|gtk-3|gdk-3|gdk_pixbuf|atk|atspi|pango|cairo|pixman|epoxy|harfbuzz|graphite2|fribidi|thai|datrie|fontconfig|freetype|mvec|stdc\+\+|gcc_s)" || true)
          if [ -n "$bundled" ]; then
              echo "Bundled, but must be the system's:"; echo "$bundled"; exit 1
          fi
          for file in guitar_tap/icons/guitar-tap.svg guitar_tap/icons/guitar-tap-splash.png \
                      guitar_tap/fonts/LiberationSans-Regular.ttf; do
              [ -f "$internal/$file" ] || { echo "Missing: $file"; exit 1; }
          done

      # It starts and stays up, with no error — off-screen, in a settings sandbox of its own, with no sound
      # server and no PortAudio on the system: the bundled one is used.
      - name: Start test
        env:
          QT_QPA_PLATFORM: offscreen
          GT_TEST_SANDBOX: "1"
          GT_AUDIO_BACKEND_REPORT: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get remove -y libportaudio2
          set +e
          timeout 20 "$(ls dist/guitar-tap-*.AppImage)" > start.log 2>&1
          code=$?
          tail -30 start.log
          echo "exit code $code (124: still running when stopped, as wanted)"
          [ "$code" = 124 ] || exit 1
          if grep -q "Traceback" start.log; then echo "An error was raised while starting"; exit 1; fi
          grep "audio backend:" start.log
          grep -q "audio backend: library .*/_internal/libportaudio.so.2" start.log \
              || { echo "The bundled PortAudio was not the one loaded"; exit 1; }

      # The .deb installs with apt, with the dependencies dpkg-shlibdeps found; the app is on the PATH and in the
      # applications menu, starts as the AppImage does, and quits cleanly: in a window on an X display, as on a
      # desktop, and closed by Ctrl+C, whose handler closes the window as its close button does. Removed again,
      # nothing is left in /opt.
      - name: .deb install, start and quit test
        env:
          GT_TEST_SANDBOX: "1"
          GT_AUDIO_BACKEND_REPORT: "1"
        run: |
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          dpkg-deb --field "$(ls dist/guitar-tap-*.deb)" Depends
          sudo apt-get install -y "./$(ls dist/guitar-tap-*.deb)"
          test -f /usr/share/applications/guitar-tap.desktop
          set +e
          xvfb-run -a timeout --preserve-status -k 10 -s INT 20 guitar-tap > start-deb.log 2>&1
          code=$?
          set -e
          tail -30 start-deb.log
          echo "exit code $code (0: quit cleanly when closed, as wanted)"
          [ "$code" = 0 ] || exit 1
          if grep -q -E "Traceback|Fatal Python error" start-deb.log; then echo "An error was raised"; exit 1; fi
          grep -q "audio backend: library /opt/guitar-tap/_internal/libportaudio.so.2" start-deb.log \
              || { echo "The bundled PortAudio was not the one loaded"; exit 1; }
          sudo apt-get remove -y guitar-tap
          [ ! -e /opt/guitar-tap ] || { echo "/opt/guitar-tap is left after removing"; exit 1; }

      # The .rpm installs with dnf on Fedora, in a container. It declares no dependencies (AutoReqProv: no), so the
      # libraries a Fedora desktop has are installed first, as the start test needs them; then it starts and quits
      # as above, off-screen.
      - name: .rpm install and start test
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -c '
            set -e
            dnf install -y -q mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs alsa-lib xcb-util-cursor
            dnf install -y -q /dist/guitar-tap-*.rpm
            test -f /usr/share/applications/guitar-tap.desktop
            set +e
            QT_QPA_PLATFORM=offscreen GT_TEST_SANDBOX=1 GT_AUDIO_BACKEND_REPORT=1 \
              timeout --preserve-status -k 10 -s INT 20 guitar-tap > /tmp/start.log 2>&1
            code=$?
            set -e
            tail -30 /tmp/start.log
            echo "exit code $code (0: quit cleanly when closed, as wanted)"
            [ "$code" = 0 ]
            ! grep -q -E "Traceback|Fatal Python error" /tmp/start.log
            grep -q "audio backend: library /opt/guitar-tap/_internal/libportaudio.so.2" /tmp/start.log
            dnf remove -y -q guitar-tap
            [ ! -e /opt/guitar-tap ]
          '

      - uses: actions/upload-artifact@v7
        with:
          name: guitar-tap-linux
          path: |
            dist/guitar-tap-*.AppImage
            dist/guitar-tap-*.deb
            dist/guitar-tap-*.rpm
          if-no-files-found: error

  # The Windows installer: PyInstaller, then Inno Setup (packaging/build_win). Not signed.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Python environment
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/python -m pip install -r requirements-packaging.txt
          .venv/Scripts/python -m pip install -e . --no-deps

      # Inno Setup 6, where packaging/build_win runs it.
      - name: Inno Setup
        run: |
          [ -f "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup --no-progress -y

      - name: Build
        run: ./packaging/build_win

      - name: Check the version and build
        run: packaging/check_release_build "installer/Guitar_Tap_V*.exe"

      # The built app starts and stays up, with no error — off-screen, in a settings sandbox of its own.
      - name: Start test
        env:
          QT_QPA_PLATFORM: offscreen
          GT_TEST_SANDBOX: "1"
        run: |
          set +e
          timeout 20 dist/guitar-tap/guitar-tap.exe > start.log 2>&1
          code=$?
          tail -30 start.log
          echo "exit code $code (124: still running when stopped, as wanted)"
          [ "$code" = 124 ] || exit 1
          if grep -q "Traceback" start.log; then echo "An error was raised while starting"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: guitar-tap-windows-installer
          path: installer/Guitar_Tap_V*.exe
          if-no-files-found: error

  # The macOS .dmg, signed with the owner's Developer ID and notarised by Apple, and the two PDFs packaging/build_mac
  # makes with it — built by build_mac as on the owner's Mac. Its credentials are the secrets of the macos-signing
  # environment, which waits for the owner's approval before a run may use them: the Developer ID Application
  # certificate with its private key (MACOS_CERTIFICATE_P12, base64, and MACOS_CERTIFICATE_PASSWORD) and an App Store
  # Connect API key for notarisation (APPSTORE_API_KEY_P8, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID). They go
  # into a keychain of the run's own, deleted at the end. The certificate lasts a year: when it is renewed, its secret
  # is replaced (RELEASE-CHECKLIST.md).
  macos:
    runs-on: macos-latest
    environment: macos-signing
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # create-dmg for the .dmg; Pango for the Quick Start (WeasyPrint); pandoc and BasicTeX's xelatex for the
      # release notes.
      - name: Tools
        run: |
          brew install create-dmg pango pandoc
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-packaging.txt
          .venv/bin/python -m pip install -e . --no-deps

      # A keychain of the run's own, the default for the run, holding the certificate, its private key, Apple's G2
      # Developer ID intermediate it is issued from, and the notarisation profile build_mac names.
      - name: Signing keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "No valid Developer ID Application identity in the keychain"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials guitar-tap-notary --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID" --keychain "$keychain"
          rm "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_PROFILE=guitar-tap-notary" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # The PDFs, then PyInstaller, the .dmg, signing, notarisation and stapling.
      - name: Build
        run: ./packaging/build_mac

      - name: Check the version and build
        run: packaging/check_release_build "Guitar_Tap_V*.dmg"

      # Signed by the owner's team, notarised, the ticket stapled; Gatekeeper accepts the .dmg and the app in it.
      - name: Check the signature and notarisation
        run: |
          dmg=$(ls Guitar_Tap_V*.dmg)
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"
          codesign -dvv "$dmg" 2>&1 | grep -q "TeamIdentifier=43QHHT3XK2" || { echo "Not signed by team 43QHHT3XK2"; exit 1; }
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// { print $NF; exit }')
          spctl -a -t exec -vv "$mount/Guitar Tap.app"
          codesign --verify --deep --strict "$mount/Guitar Tap.app"
          codesign -d --entitlements - "$mount/Guitar Tap.app" 2>/dev/null | grep -q "com.apple.security.device.audio-input" || { echo "No audio-input entitlement"; exit 1; }
          hdiutil detach "$mount"

      # The built app starts and stays up, with no error — off-screen, in a settings sandbox of its own.
      - name: Start test
        env:
          QT_QPA_PLATFORM: offscreen
          GT_TEST_SANDBOX: "1"
        run: |
          set +e
          "dist/Guitar Tap.app/Contents/MacOS/guitar-tap" > start.log 2>&1 &
          pid=$!
          sleep 20
          kill -0 "$pid" 2>/dev/null; running=$?
          kill "$pid" 2>/dev/null
          tail -30 start.log
          [ "$running" = 0 ] || { echo "It was not running after 20 seconds"; exit 1; }
          if grep -q "Traceback" start.log; then echo "An error was raised while starting"; exit 1; fi

      - name: Remove the signing keychain
        if: ${{ always() }}
        run: |
          [ -z "${SIGNING_KEYCHAIN:-}" ] || security delete-keychain "$SIGNING_KEYCHAIN"

      # The release's files side by side, as the draft lists them.
      - name: Collect the files
        run: |
          mkdir release-files
          cp Guitar_Tap_V*.dmg docs/ReleaseNotes-*.pdf docs/GuitarTap-Quick-Start-Guide.pdf release-files/
          ls -l release-files

      - uses: actions/upload-artifact@v7
        with:
          name: guitar-tap-macos
          path: release-files/*
          if-no-files-found: error

  # The draft release: a draft for the release's tag, created at the built commit; GitHub creates the tag only when
  # the draft is published (an existing tag stays as it is). An existing draft gets the files, replacing ones of the
  # same name. SHA256SUMS lists the files this workflow attaches.
  draft:
    if: ${{ inputs.draft }}
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      RELEASE: ${{ inputs.release || inputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v7
        with:
          path: files
          merge-multiple: true

      - name: Attach to the draft release
        run: |
          (cd files && sha256sum -- * > SHA256SUMS)
          ls -l files
          cat files/SHA256SUMS
          if gh release view "$RELEASE" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release upload "$RELEASE" files/* --clobber
          elif gh release view "$RELEASE" >/dev/null 2>&1; then
            echo "$RELEASE is already published: its files are not replaced by a workflow." >&2
            exit 1
          else
            gh release create "$RELEASE" files/* --draft --target "$(git rev-parse HEAD)" \
              --title "Release $RELEASE" --notes "The release's notes: a short summary of its enhancements."
          fi
          echo "Draft $RELEASE: https://github.com/$GITHUB_REPOSITORY/releases"
