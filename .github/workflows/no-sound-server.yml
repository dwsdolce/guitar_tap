# TEMPORARY — removed after one run. Linux with no sound server (Ubuntu 26.04, where PortAudio cannot
# start without one): the app starts and reports the input unavailable.
name: No sound server

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: System packages, no sound server
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          lsb_release -d
          (pactl info 2>&1 || true) | head -2

      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip install -e . --no-deps

      - name: 1. A plain import of sounddevice
        run: |
          .venv/bin/python -c "import sounddevice; print('imported: PortAudio started')" \
            || echo "import failed, as before the fix"

      - name: 2. The app's modules and the analyzer
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/python - <<'EOF'
          from guitar_tap.models import audio_backend
          from guitar_tap.models.realtime_fft_analyzer import RealtimeFFTAnalyzer
          print("modules loaded; PortAudio started:", audio_backend.portaudio_started())
          print("start error:", audio_backend.start_error)
          analyzer = RealtimeFFTAnalyzer.for_testing()
          analyzer.is_for_testing = False
          analyzer._check_microphone_permission = lambda: True
          try:
              analyzer.start()
              print("started")
          except audio_backend.sd.PortAudioError as exc:
              print("start failed:", exc)
          print("input unavailable:", analyzer.input_unavailable, "|", analyzer.not_running_message)
          EOF

      - name: 3. The app itself, off-screen for 15 s
        env:
          QT_QPA_PLATFORM: offscreen
          GT_TEST_SANDBOX: "1"
        run: |
          set +e
          timeout 15 .venv/bin/python -m guitar_tap > app.log 2>&1
          code=$?
          tail -20 app.log
          echo "exit code $code (124: still running when stopped, as wanted)"
          [ "$code" = 124 ]
